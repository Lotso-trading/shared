name: CI / CD - Shared Contracts

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Lint, Type-Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint (Biome)
        run: deno task lint

      - name: Type-Check (deno check)
        run: deno task check

      - name: Run Unit Tests
        run: deno task test

  release-and-publish:
    name: Semantic-Release & NPM Publish
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js (GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@lotso-trading"

      - name: Verify Build (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          deno task build:npm
          cd npm
          npm pack --dry-run
          echo "✅ Package artifact successfully verified on PR."

      - name: Automated Semantic Release & Publish (Push develop / main)
        if: github.event_name == 'push'
        run: |
          npx --yes \
            -p semantic-release@^24.2.0 \
            -p @semantic-release/exec@^6.0.3 \
            -p @semantic-release/github@^11.0.0 \
            -p conventional-changelog-conventionalcommits@^8.0.0 \
            semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
